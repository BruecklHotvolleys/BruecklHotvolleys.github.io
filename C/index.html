  <style>
html, body, * {
  -webkit-user-select: none;
  -moz-user-select: none;

  border: 0 none;

}
html, body {
  overflow: hidden;
}
div.header {
  position: absolute;
  box-sizing: border-box;
  overflow: hidden;
  
  left: 0;
  padding-left: 50px;
  width: 100%;
  top: 0;

}

div.header > div.title {

}
div.header > div.subtitle {

}

div.header > span.icon {

  top: 2px;

  color: #EEEEEE;
  text-align: center;

}
div.header > img {

}
div.header > span.header {

}
div.header > span.text {

div.header > span.footer {

div.header > a.to_menu {

svg#button-fullscreen {

div.content {

  width: 100%;

div.container {

div.img {

}
div.img > svg {
  height: 100%;
  width: auto;
  max-width: 100%;
}

div.text {
  box-sizing: border-box;

}

@media (orientation: landscape) {
  div.container.full {
    overflow: hidden;
  }

    width: 50%;

label.tree-menu {

}
label.tree-menu > span {

input {

}

div.tree {
  display: none;

  top: 50px;
  left: 0;
  width: 100%;
  bottom: 30px;
  z-index: 99;

}
div.tree > div.tree-bg {

  top: 0;

div.tree > div.tree-content {
  position: absolute;
  top: 0;

  height: 100%;
  
  overflow: auto;

}
input#tree-toggle:checked + div.tree {

@media (width < 400px) {
  div.tree > div.tree-content {

    max-width: 100%;

div.item {
  position: relative;
}

div.item > input.item-toggle + label > span:first-child {
  display: none;
}
div.item > input.item-toggle + label > span:nth-child(2) {
  display: block;
}
div.item > input.item-toggle:checked + label > span:first-child {
  display: block;
}
div.item > input.item-toggle:checked + label > span:nth-child(2) {
  display: none;

div.item > input.item-toggle + label > img:first-child {

}
div.item > input.item-toggle + label > img:nth-child(2) {
  display: block;
}
div.item > input.item-toggle:checked + label > img:first-child {
  display: block;
}
div.item > input.item-toggle:checked + label > img:nth-child(2) {
  display: none;
}

div.item > input.item-toggle:checked ~ .item-container {
  display: block;
}



div.item > label {

  text-align: center;

}
div.item > span.item-header > img {
  position: absolute;
  left: 2px;

  top: 2px;
  height: 46px;
}
div.item > .item-header > span.header {
  position: absolute;
  top: 1px;

}
div.item > .item-header > span.text {

div.item > .item-header:hover, div.item > .item-header:hover > span.text {

div.item > .item-header > span.footer {

  bottom: 1px;
  left: 50px;
  font-size: 0.5em;
}

div.item > div.item-container {

  padding-left: 26px;

}
div.footer {

  left: 0;

  bottom: 0;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 14pt;
}

  <script>
function init() {
  var items = document.querySelectorAll("div.tree span.item-header");
  items.forEach((item) => item.addEventListener("click", onTreeItemClick));
  
  initFullscreen();
}

function onTreeItemClick(event) {
  // if any animator: ensure end of running animation
  if (window.animator) {
    animator.stop();
  }
  
  var item = searchTreeItem(event.target ? event.target : event.srcElement);
  var id = item && item.dataset && item.dataset.id ? item.dataset.id : "??";
  
  //alert("click: " + id);
  loadData("/C/header_" + id + ".html", (header) => {
    var h = document.querySelector("div.header");
    if (h) {
      h.innerHTML = header;
      setTimeout(function() {
        initFullscreen();
      }, 111);
    }
  });
  loadData("/C/content_" + id + ".html", (header) => {
    var c = document.querySelector("div.content");
    if (c) {
      c.innerHTML = header;
    }
  });
  setTimeout(function() {
    loadScript("/C/script_" + id + ".js", "script_" + id + "\\.js", () => {
      console.log("Script for " + id + " has been loaded.");
    });
  }, 55);
  closeTree();
}

function searchTreeItem(elem) {
  while (elem) {
    if (elem.className.indexOf("item-header") >= 0) {
      return elem;
    }
    elem = elem.parentNode;
  }
  
  return null;
}

function loadData(data, handler) {
  var xhttp = new XMLHttpRequest();
  xhttp.onreadystatechange = function() {
    if (this.readyState == 4) {
      if (this.status == 200) {
        handler(this.responseText);
      } else {
        handler(this.status);
      }
    }
  };
  xhttp.open("GET", data, true);
  xhttp.send();
}

var registeredScript = undefined;

function unregisterPreviousScript() {
  if (registeredScript) {
    console.log("Unregister " + registeredScript);
    if (typeof unregister === 'function') {
      unregister();
    }

    var elem = document.querySelector("script[src$=" + registeredScript + "]");
    if (elem) {
      elem.remove();
    }
    registeredScript = undefined;
    console.log("Unregister done.");
  }
}

function loadScript(url, key, callback) {
  unregisterPreviousScript();

  console.log("Register " + url);
  var script = document.createElement("script");
  script.type = "text/javascript";
  
  if (script.readyState) { // only required for IE<9
    script.onreadystatechange = function() {
      if (script.readyState === "loaded" || script.readyState === "complete") {
        script.onreadystatechange = null;
        if (callback) {
          callback();
        }
      }
    };
  } else {  // Others
    script.onload = function() {
      if (callback) {
        callback();
      }
    };
  }

  script.src = url;
  document.getElementsByTagName("head")[0].appendChild(script);
  registeredScript = key;
  console.log("Register " + key + "/" + url + " done.");
}

function closeTree() {
  var cb = document.getElementById('tree-toggle');
  if (cb && cb.checked) {
    cb.checked = false;
  }
}

var requestFullscreen, exitFullscreen;

function initFullscreen() {
  requestFullscreen = document.getElementById("request-fullscreen");
  exitFullscreen = document.getElementById("exit-fullscreen");
  
  var btn = document.getElementById("button-fullscreen");
  if (btn) {
    btn.addEventListener("click", toggleFullscreen);
  }
  
  document.addEventListener("fullscreenchange", function() {
    updateFullscreenInfo();
  });
  
  updateFullscreenInfo();
}

function updateFullscreenInfo() {
  if (document.fullscreenElement) {
    requestFullscreen.setAttribute("stroke", "transparent");
    exitFullscreen.setAttribute("stroke", "black");
  } else {
    requestFullscreen.setAttribute("stroke", "black");
    exitFullscreen.setAttribute("stroke", "transparent");
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}
  </script>

<script>
(function(){
/**
 * Handles the context menu trigger to block it.
 * @param {Event} event The event data.
 * @returns {Boolean} true
 */
function onContextMenu(event) {
  event.preventDefault();
  return true;
}

// set a context menu handler
document.addEventListener('contextmenu', onContextMenu);

function unregister() {
  document.removeEventListener('contextmenu', onContextMenu);
}
window.unregister = unregister;
}());
