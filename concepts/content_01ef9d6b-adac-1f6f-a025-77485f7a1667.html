<div class="container"><div class="text"><h1 id="h_1">U12 - Supermini I</h1>
<p>Am Beginn einer hoffentlich langen und erfolgreichen Volleyballkarriere steht ein
einfaches Spielsystem, dass viele Ballkontakte für die Spielerinnen ermöglicht.</p>
<p>Die erste Spielform:</p>
<ul>
<li>2 gegen 2</li>
<li>Mixed erlaubt</li>
<li>kleines Spielfeld</li>
<li>viele Ballkontakte</li>
</ul>
</div></div>
