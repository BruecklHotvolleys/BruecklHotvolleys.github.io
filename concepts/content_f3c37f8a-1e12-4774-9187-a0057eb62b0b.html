<div class="container"><div class="text"><p>Der Ball, der über das Netz geht, ist der Angriff - unabhängig von der Technik.</p>
<p>Zurückklatschen bleibt noch länger effektiver als 2x oder gar 3x spielen,
soll aber nicht das Ziel sein!</p>
<p>3x spielen (oder wenigsten 2x) ist das Hauptziel. Wenn dann noch ein
aggressiver Angriff gelingt, umso besser.</p>
