<div class="container"><div class="text"><p>Die Außenblockspielerin stellt den Block in Abhängigkeit der Anlaufrichtung der Angreiferin.</p>
<table>
<thead>
<tr>
<th align="left"><strong>Wenn</strong></th>
<th align="left"><strong>Dann</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td align="left">die Angreiferin von außen anläuft,</td>
<td align="left">wird ein Diagonalblock gestellt.</td>
</tr>
<tr>
<td align="left">die Angreiferin im Feld bleibt und entlang der Linie anläuft,</td>
<td align="left">wird ein Linienblock gestellt.</td>
</tr>
</tbody>
</table>
