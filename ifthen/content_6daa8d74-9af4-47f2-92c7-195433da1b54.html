<div class="container"><div class="text"><p>Wenn die Feldverteidigung irgendwo eine Lücke offenlässt, sollte die Angreiferin das ausnützen.</p>
<table>
<thead>
<tr>
<th align="left"><strong>Wenn</strong></th>
<th align="left"><strong>Dann</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td align="left">die Angreiferin eine Lücke sieht,</td>
<td align="left">sollte sie eine Lob, eine Finte oder einen Driveschlag dorthin spielen.</td>
</tr>
<tr>
<td align="left">die Angreiferin keine Lücke sieht,</td>
<td align="left">hilft wohl nur Schlaghärte.</td>
</tr>
</tbody>
</table>
</div></div>
