<div class="container"><div class="text"><p>Wenn die Aufspielerin Vorderspielerin ist, kann sie manchmal bei guter Annahme eine Finte versuchen.</p>
<table>
<thead>
<tr>
<th align="left"><strong>Wenn</strong></th>
<th align="left"><strong>Dann</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td align="left">die gegnerische Blockspielerin aufpasst,</td>
<td align="left">soll die Aufspielerin aufspielen.</td>
</tr>
<tr>
<td align="left">die gegnerische Blockspielerin nicht aufpasst,</td>
<td align="left">kann die Aufspielerin eine Finte spielen.</td>
</tr>
</tbody>
</table>
</div></div>
