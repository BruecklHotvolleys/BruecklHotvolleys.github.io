<div class="container"><div class="text"><p>Bei einer Kombination sollte die Aufspielerin die gegnerische Mittelblockerin beobachten.</p>
<table>
<thead>
<tr>
<th align="left"><strong>Wenn</strong></th>
<th align="left"><strong>Dann</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td align="left">die Mittelblockerin mit der Schnellangreiferin springt,</td>
<td align="left">soll die Aufspielerin den Kombinationsball spielen.</td>
</tr>
<tr>
<td align="left">die Mittelblockerin wartet,</td>
<td align="left">soll die Aufspielerin den schnellen Ball spielen.</td>
</tr>
</tbody>
</table>
