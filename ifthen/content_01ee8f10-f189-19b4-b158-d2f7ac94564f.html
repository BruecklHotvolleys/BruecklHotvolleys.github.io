<div class="container"><div class="text"><p>Bei der Sicherung ergibt sich das System aus dem Aufspiel.</p>
<p>Dorthin, wo die Aufspielerin spielt, dorthin orientieren sich die Spielerinnen.</p>
<p>Je nach dem, wieviel Zeit bleibt - also je nach Tempo des Aufspiels, können die übrigen Spielerinnen
ihre Positionen mehr oder weniger gut einnehmen…</p>
