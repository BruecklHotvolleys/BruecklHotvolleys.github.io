</svg></div><div class="text"><h1 id="h_1">Thema</h1>
<p><strong>Vorderseite der Unterschenkel</strong></p>
<h1 id="h_2">Beschreibung</h1>
<ol>
<li>Die Knie und Fersen liegen nebeneinander am Boden,</li>
<li>auf die Fersen setzen.</li>
</ol>
<p>15sec, dann den anderen Fuß.</p>
<h1 id="h_3">Hinweise</h1>
<p>Vorsichtig, es darf nicht weh tun.</p>
<h1 id="h_4">Variationen</h1>
<ul>
<li>Nach der Belastung(z.B. am Trainingsende) 45 sec. halten.</li>
</ul>
