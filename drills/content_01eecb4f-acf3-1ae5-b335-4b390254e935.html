<div class="container"><div class="text"><h1 id="h_1">Thema</h1>
<p><strong>„Nur” Anlaufen</strong></p>
<h1 id="h_2">Beschreibung</h1>
<ul>
<li>Den Anwurf simulieren und</li>
<li>aus dem Armschwung der Wurfbewegung den Anlauf (wie zum Angriffsschlag) durchführen.</li>
<li>Mit und ohne Absprung versuchen.</li>
</ul>
<h1 id="h_3">Hinweise</h1>
<ul>

</ul>
